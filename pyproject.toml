[project]
name = "openapi-agent"
version = "0.1.0"
description = "OpenAPI 契约智能生成 Agent（自研状态机流水线，无 Agent 框架）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.30",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "deepdiff>=7.0",
]

[project.optional-dependencies]
# 注意：OCR 链路基于 PaddleOCR 2.x 的 API（use_angle_cls / show_log / ocr(cls=...)），
# PaddleOCR 3.x 已移除这些参数，因此这里锁 <3.0。
ocr = ["paddleocr>=2.7,<3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
